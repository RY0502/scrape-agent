services:
  - type: web
    name: scrape-agent
    runtime: node
    plan: starter
    buildCommand: rm -rf /opt/render/.cache/puppeteer/chrome-headless-shell && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: PAGE_TIMEOUT_MS
        value: "25000"
      - key: PAGE_SETTLE_MS
        value: "2000"
      - key: SCREENSHOT_WIDTH
        value: "1280"
      - key: SCREENSHOT_HEIGHT
        value: "900"
      - key: SCREENSHOT_QUALITY
        value: "70"
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_VISION_MODEL
        value: meta-llama/Llama-3.2-11B-Vision-Instruct
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: NVIDIA_VISION_MODEL
        value: mistralai/mistral-large-3-675b-instruct-2512
      - key: NVIDIA_API_KEY
        sync: false
      - key: SAMBANOVA_VISION_MODEL
        value: Llama-4-Maverick-17B-128E-Instruct
      - key: SAMBANOVA_API_KEY
        sync: false
