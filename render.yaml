services:
  - type: web
    name: scrape-agent
    runtime: node
    plan: starter
    buildCommand: rm -rf node_modules dist && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: PAGE_TIMEOUT_MS
        value: "25000"
      - key: PAGE_SETTLE_MS
        value: "3000"
      - key: SCREENSHOT_WIDTH
        value: "1280"
      - key: SCREENSHOT_HEIGHT
        value: "900"
      - key: SCREENSHOT_QUALITY
        value: "70"
